<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тех. карты кофейни</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f5f1ea;
            color: #3e2723;
            line-height: 1.5
        }

        header {
            background: #4e342e;
            color: #fff;
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10
        }

        header h1 {
            margin-bottom: 12px;
            font-size: 22px
        }

        #search {
            width: 100%;
            max-width: 400px;
            padding: 10px 16px;
            border: none;
            border-radius: 24px;
            font-size: 16px;
            background: rgba(255, 255, 255, .95)
        }

        main {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto
        }

        #categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 16px
        }

        .cat-btn {
            background: #fff;
            padding: 12px 16px;
            border-radius: 12px;
            border: 2px solid transparent;
            cursor: pointer;
            white-space: nowrap;
            font-size: 15px
        }

        .cat-btn.active {
            background: #6d4c41;
            color: #fff
        }

        #drinks {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px
        }

        .drink-card {
            background: #fff;
            padding: 14px;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .08)
        }

        .drink-card h3 {
            font-size: 16px;
            margin-bottom: 4px
        }

        .drink-card .volume {
            color: #8d6e63;
            font-size: 13px
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 15px;
            z-index: 100
        }

        .modal.show {
            display: flex
        }

        .modal-content {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative
        }

        .close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #eee;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer
        }

        .modal h2 {
            margin-bottom: 8px;
            padding-right: 40px
        }

        .modal .meta {
            color: #8d6e63;
            margin-bottom: 16px
        }

        .modal h4 {
            margin: 16px 0 8px;
            color: #4e342e;
            text-transform: uppercase;
            font-size: 12px
        }

        .modal ul,
        .modal ol {
            padding-left: 20px
        }

        .modal li {
            margin-bottom: 6px
        }

        .sizes {
            margin-top: 10px;
            padding: 10px;
            background: #efebe9;
            border-radius: 8px
        }

        .sizes div {
            margin-bottom: 4px
        }
    </style>
</head>

<body>
    <header>
        <h1>☕ Чай лучше </h1><input type="text" id="search" placeholder="Поиск напитка...">
    </header>
    <main>
        <nav id="categories"></nav>
        <section id="drinks"></section>
    </main>
    <div id="modal" class="modal">
        <div class="modal-content">
            <button class="close" id="closeBtn">×</button>
            <div id="modal-body"></div>
        </div>

        };

        let currentCategory = null;

        function renderCategories() {
            const nav = document.getElementById('categories');
            nav.innerHTML = data.categories.map(c => `<button class="cat-btn" data-id="${c.id}">${c.icon} ${c.name}</button>`).join('');
            nav.querySelectorAll('.cat-btn').forEach(btn => {
                btn.addEventListener('click', () => { isSearchMode = false; document.getElementById('search').value = ''; selectCategory(btn.dataset.id) })
            })
        }

        function selectCategory(id) {
            currentCategory = data.categories.find(c => c.id === id);
            document.querySelectorAll('.cat-btn').forEach(b => { b.classList.toggle('active', b.dataset.id === id) });
            renderDrinks(currentCategory.drinks)
        }

        function renderDrinks(drinks) {
            const section = document.getElementById('drinks');
            if (!drinks || !drinks.length) { section.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#8d6e63">Ничего не найдено</p>'; return }
            section.innerHTML = drinks.map((d, i) => {
                const catId = isSearchMode ? d._catId : currentCategory.id;
                return `<div class="drink-card" data-cat="${catId}" data-idx="${i}"><h3>${d.name}</h3><div class="volume">${d.volume || d.sizes?.map(s => s.volume).join(' / ')}</div></div>`
            }).join('');
            section.querySelectorAll('.drink-card').forEach(card => {
                card.addEventListener('click', function () { openDrink(this.dataset.cat, this.dataset.idx) })
            })
        }

        function openDrink(catId, idx) {
            const cat = data.categories.find(c => c.id === catId);
            if (!cat) return;
            const drink = cat.drinks[idx];
            if (!drink) return;
            let sizesHtml = '';
            if (drink.sizes) { sizesHtml = `<h4>Размеры</h4><div class="sizes">${drink.sizes.map(s => `<div><b>${s.volume}</b> — ${s.recipe}</div>`).join('')}</div>` }
            document.getElementById('modal-body').innerHTML = `<h2>${drink.name}</h2><div class="meta">${drink.volume || drink.sizes?.map(s => s.volume).join(' / ')}</div>${sizesHtml}<h4>Ингредиенты</h4><ul>${drink.ingredients.map(i => `<li><b>${i.name}</b> — ${i.amount}</li>`).join('')}</ul><h4>Приготовление</h4><ol>${drink.steps.map(s => `<li>${s}</li>`).join('')}</ol>${drink.notes ? `<div style="margin-top:14px;padding:10px;background:#fff8e1;border-left:4px solid #ffa726;border-radius:6px"><b> Примечание:</b> ${drink.notes}</div>` : ''}`;
            document.getElementById('modal').classList.add('show')
        }

        function closeModal() { document.getElementById('modal').classList.remove('show') }

        document.getElementById('closeBtn').addEventListener('click', closeModal);
        document.getElementById('modal').addEventListener('click', function (e) { if (e.target === this) closeModal() });

        let isSearchMode = false;
        document.getElementById('search').addEventListener('input', function (e) {
            const q = e.target.value.toLowerCase().trim();
            if (!q) { isSearchMode = false; renderDrinks(currentCategory.drinks); return }
            isSearchMode = true;
            const results = [];
            data.categories.forEach(c => {
                c.drinks.forEach((d, i) => {
                    if (d.name.toLowerCase().includes(q)) { results.push({ ...d, _catId: c.id, _idx: i }) }
                })
            });
            renderDrinks(results)
        });

        renderCategories();
        selectCategory(data.categories[0].id);
    </script>
